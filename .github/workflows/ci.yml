name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python3 -m py_compile skills/*/scripts/*.py
      - name: Script help runs
        run: python3 skills/aeo-seo-optimize/scripts/score.py --help
      - name: Validate JSON manifests
        run: for f in .claude-plugin/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: Check SKILL.md front matter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f: missing front matter"; exit 1; }
            grep -q '^name:' "$f" && grep -q '^description:' "$f" || { echo "$f: needs name and description"; exit 1; }
          done
